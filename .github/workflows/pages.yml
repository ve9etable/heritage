name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 生成数据并校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 启用并校验 Pages 设置。enablement: true 让仓库未开 Pages 时由本步骤自动创建
      # （GitHub 的 Actions 默认不代开 Pages，缺这一步 deploy-pages 会 404）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 从 sites/*.html 生成数据索引
        run: node tools/build.js

      - name: 校验站点结构与数据
        run: node tools/check.js

      - name: 生成 artifact
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r sites data _site/

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
