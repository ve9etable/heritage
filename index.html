<style>

  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased;background:var(--stone-2);

  .kicker i{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(207,168,60,.22);}
  .hero h1{font-size:38px;line-height:1.2;font-weight:800;letter-spacing:2.5px;margin-top:18px;}
  .hero h1 em{font-style:normal;position:relative;color:#f0d99a;}
  .hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:9px;
    background:linear-gradient(90deg,rgba(207,168,60,.42),transparent 85%);border-radius:3px;z-index:-1;}
  .hero .sub{font-size:14.5px;color:#cdc4b3;margin-top:14px;max-width:640px;}
  .hero .sub b{color:#ffe0cd;font-weight:600;}
  .seal{flex:0 0 auto;width:104px;height:104px;border-radius:8px;display:grid;place-items:center;

    letter-spacing:3px;font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;text-align:center;

  /* ================= SEARCH ================= */
  .search{margin-top:28px;max-width:640px;}
  .search-box{display:flex;align-items:center;gap:11px;background:rgba(254,253,248,.97);

  .clear-btn:hover{background:#e0d8c1;color:var(--ink);}
  .hints{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .hints .lbl{font-size:11.5px;letter-spacing:1px;color:#9d937c;}
  .hint{font:inherit;font-size:12.5px;cursor:pointer;border-radius:999px;padding:3px 11px;

    transition:background .16s,color .16s,border-color .16s;}
  .hint:hover{background:rgba(207,168,60,.26);border-color:rgba(207,168,60,.5);color:#fff7e2;}

  .stats{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf6,#f6f2e6);}
  .stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
  .stat{padding:18px 20px 17px;border-left:1px solid var(--line);position:relative;}
  .stat:first-child{border-left:0;}

  .stat .n small{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:3px;letter-spacing:0;}
  .stat .l{font-size:12px;color:var(--ink-2);letter-spacing:1.2px;margin-top:4px;}
  @media(max-width:720px){
    .stats .wrap{grid-template-columns:repeat(2,1fr);}
    .stat:nth-child(3){border-left:0;}
    .stat:nth-child(n+3){border-top:1px solid var(--line);}
  }

  .chip{font:inherit;font-size:13px;cursor:pointer;background:var(--paper);color:var(--ink-2);

  .chip:hover{border-color:var(--gold);color:var(--brick-deep);

    color:#f7f0dd;box-shadow:0 4px 12px -5px rgba(74,61,15,.8);}
  .chip .n{opacity:.6;font-size:11.5px;margin-left:4px;}
  .spacer{flex:1 1 auto;}
  .count{font-size:13px;color:var(--ink-2);white-space:nowrap;}
  .count b{font-family:"Noto Serif SC",serif;font-size:16px;color:var(--brick-deep);}

  select.sel{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);

    color:var(--ink);outline:0;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:26px;}
  select.sel:hover{border-color:var(--gold);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;padding:32px 0 46px;}
  .card{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);
    transition:transform .28s cubic-bezier(.2,.75,.3,1),box-shadow .28s,border-color .28s;
    opacity:0;transform:translateY(14px);}
  .card.in{opacity:1;transform:none;}
  .card:hover{transform:translateY(-6px);box-shadow:var(--sh-h);border-color:color-mix(in srgb,var(--a) 45%,var(--line));}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;z-index:3;
    background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a) 25%,transparent) 55%,transparent 90%);}

  .thumb{position:relative;height:176px;overflow:hidden;background:linear-gradient(150deg,var(--a2),var(--a) 78%);}
  .thumb .art{position:absolute;inset:0;width:100%;height:100%;
    transition:transform .5s cubic-bezier(.2,.75,.3,1);}
  .card:hover .thumb .art{transform:scale(1.045);}
  .thumb::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.20),transparent 34%,transparent 68%,rgba(0,0,0,.10));}
  .thumb .glyph{position:absolute;right:12px;bottom:-24px;z-index:1;font-size:112px;line-height:1;
    font-family:"Noto Serif SC","Songti SC",serif;font-weight:800;color:rgba(255,255,255,.20);
    text-shadow:0 2px 10px rgba(0,0,0,.18);transition:transform .5s cubic-bezier(.2,.75,.3,1);}
  .card:hover .thumb .glyph{transform:translateY(-4px) rotate(-3deg);}
  .thumb .tier{position:absolute;left:12px;top:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:.4px;color:#fff;background:rgba(28,22,12,.42);
    border:1px solid rgba(255,255,255,.30);padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px);}
  .thumb .tier::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gold-soft);}
  .thumb .era{position:absolute;right:12px;top:12px;z-index:2;font-size:11px;letter-spacing:.4px;
    color:rgba(255,255,255,.95);background:rgba(28,22,12,.34);border:1px solid rgba(255,255,255,.22);
    padding:4px 9px;border-radius:999px;backdrop-filter:blur(4px);}

  .body{padding:17px 19px 15px;display:flex;flex-direction:column;gap:10px;flex:1 1 auto;}
  .body h2{font-size:21px;font-weight:800;letter-spacing:.8px;line-height:1.3;display:flex;
    align-items:baseline;gap:7px;flex-wrap:wrap;}
  .body h2 .en{font-size:11.5px;font-weight:400;letter-spacing:.8px;color:var(--ink-3);}
  .where{display:flex;flex-wrap:wrap;gap:6px;font-size:11.8px;color:var(--ink-2);}
  .where span{background:#f2ecda;border:1px solid var(--line);padding:2px 8px;border-radius:7px;line-height:1.6;}
  .desc{font-size:13.7px;color:var(--ink-2);line-height:1.9;display:-webkit-box;
    -webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .points{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;
    background:linear-gradient(180deg,#fbf8ef,#f6f1e2);border:1px solid var(--line);}
  .points li{list-style:none;font-size:12.8px;color:var(--ink);display:flex;gap:8px;line-height:1.65;}
  .points li::before{content:"";flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--a);
    margin-top:8px;box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent);}
  .tags{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-size:11.3px;color:var(--a2);background:color-mix(in srgb,var(--a) 10%,#fff);
    border:1px solid color-mix(in srgb,var(--a) 30%,#fff);padding:2px 8px;border-radius:999px;line-height:1.6;}
  .foot{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:9px;}
  .go{font-size:13.5px;font-weight:700;color:var(--a2);letter-spacing:.6px;white-space:nowrap;}
  .foot .hintline{font-size:11.2px;color:var(--ink-3);margin-left:auto;text-align:right;line-height:1.5;}
  .foot .arrow{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;

    transition:transform .25s,background .25s,color .25s;}
  .card:hover .foot .arrow{transform:translateX(3px);background:var(--a);color:#fff;}

  .empty{text-align:center;padding:64px 20px 74px;color:var(--ink-2);}
  .empty .big{font-size:46px;line-height:1;margin-bottom:12px;color:var(--ink-3);}
  .empty p{font-size:14.5px;}
  .empty .q{color:var(--brick-deep);font-weight:700;}
  .empty button{font:inherit;font-size:13.5px;margin-top:16px;cursor:pointer;background:var(--paper);
    border:1px solid var(--line);color:var(--ink);padding:8px 18px;border-radius:999px;transition:all .16s;}
  .empty button:hover{border-color:var(--gold);color:var(--brick-deep);transform:translateY(-1px);
    box-shadow:var(--sh);}

  footer.site{position:relative;color:#a89f8d;text-align:center;padding:30px 22px 34px;font-size:12.5px;
    background:linear-gradient(180deg,#2b261a,#221e15);border-top:4px solid var(--gold);}
  footer.site::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(122deg,rgba(230,217,138,.04) 0 1px,transparent 1px 14px);}
  footer.site>*{position:relative;}
  footer.site .q{color:var(--gold-soft);font-family:"Noto Serif SC",serif;font-size:15px;letter-spacing:3px;}

  .totop{position:fixed;right:20px;bottom:20px;z-index:40;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:rgba(254,253,248,.94);color:var(--brick-deep);cursor:pointer;
    font-size:16px;display:grid;place-items:center;box-shadow:var(--sh);opacity:0;pointer-events:none;
    transform:translateY(10px);transition:opacity .25s,transform .25s,box-shadow .2s;}
  .totop.show{opacity:1;pointer-events:auto;transform:none;}
  .totop:hover{box-shadow:var(--sh-h);transform:translateY(-2px);}

  @media(max-width:680px){
    .hero-in{flex-direction:column;gap:20px;padding:34px 0 30px;gap:18px;}
    .hero h1{font-size:26px;letter-spacing:1.6px;}
    .seal{width:74px;height:74px;font-size:17px;letter-spacing:2px;transform:rotate(-3deg);}
    .seal span{font-size:10px;}
    .spacer{display:none;}
    .toolbar .wrap{gap:8px;padding-top:9px;padding-bottom:9px;}
    .count{order:-1;width:100%;}
    .grid{grid-template-columns:1fr;gap:16px;padding-top:22px;}
  }
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;}}
</style>
</head>

  function esc(s){

  }

  function hl(text, q){
    var safe = esc(text);
    var terms = (q || "").trim().split(/\s+/).filter(function(t){ return t; });
    if(!terms.length) return safe;
    var re = new RegExp("(" + terms.map(function(t){
      return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }).join("|") + ")", "gi");
    return safe.replace(re, "<mark>$1</mark>");
  }

  }

  var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){

  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 }) : null;

    var list = sortList(SITES.filter(matches));
